[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadow-link"
version = "3.0.0"
description = "Shadow Link v3 — the local, terminal-native cognitive mirror"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.36",
    "mcp>=1.0.0,<2",
    "mitmproxy>=10.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["shadow_link"]

[project.scripts]
shadow-link = "shadow_link.cli:main"

[project.urls]
Homepage = "https://github.com/AIden6464-AI/Shadow-Link-v3"
Repository = "https://github.com/AIden6464-AI/Shadow-Link-v3"
Issues = "https://github.com/AIden6464-AI/Shadow-Link-v3/issues"
